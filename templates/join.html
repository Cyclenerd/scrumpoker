<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Join {{.RoomID}} - Scrum Poker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icon/apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon/192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
    <script src="/static/js/main_nocol1.js"></script>
</head>

<body class="bg-body-tertiary">
    <canvas id="shaderCanvas"></canvas>
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg border-0" style="max-width: 400px; border-radius: 1rem;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="/static/img/logo.webp" class="img-fluid mb-3" alt="Scrum Poker Logo">
                    <h1 class="h3 fw-bold">Join Room</h1>
                    <p><code>{{.RoomID}}</code></p>
                    <p class="text-muted small">Enter your name to join the room</p>
                </div>

                <div id="form-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Generate form with JavaScript to prevent bot submissions
        // We expect bots are not executing JavaScript, so they won't see or be able to submit the form
        (function () {
            // Obfuscate the form action URL - decode from base64
            const encodedPath = 'L2pvaW4v'; // '/join/' in base64
            const basePath = atob(encodedPath);
            const roomId = '{{.RoomID}}';
            const formAction = basePath + roomId;

            const formHTML = `
                <form method="POST" action="">
                    <div class="mb-4">
                        <label for="name" class="form-label small text-muted">Player Name</label>
                        <input type="text" class="form-control" id="name" name="name" minlength="3" maxlength="16"
                            placeholder="Your name..." required autofocus>
                        <div class="form-text small">Visible to others in the room</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Join Room</button>
                </form>
            `;

            document.getElementById('form-container').innerHTML = formHTML;

            // Set the form action dynamically
            const form = document.querySelector('#form-container form');
            if (form) {
                form.setAttribute('action', formAction);
            }

            // Set focus on the name input after form is created
            const nameInput = document.getElementById('name');
            if (nameInput) {
                nameInput.focus();
            }
        })();
    </script>
</body>

</html>
