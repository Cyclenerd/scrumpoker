<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Logged Out - Scrum Poker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icon/apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon/192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg border-0" style="max-width: 400px; border-radius: 1rem;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="/static/img/logo.webp" class="img-fluid mb-3" alt="Scrum Poker Logo">
                    <h1 class="h3 fw-bold">Goodbye!</h1>
                    <p class="text-muted small">Thanks for playing!<br>You have left the room.</p>
                </div>

                <p><a href="/room/{{.RoomID}}" class="btn btn-primary w-100 py-2 fw-semibold">Rejoin Room</a></p>
                <p><a href="/" class="btn btn-danger w-100 py-2 fw-semibold">Back to Home</a></p>
            </div>
        </div>
    </div>
</body>

</html>
