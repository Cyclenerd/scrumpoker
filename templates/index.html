<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Scrum Poker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icon/apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon/192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body">
    <nav class="navbar bg-body-tertiary border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Scrum Poker
            </a>
            <div class="d-flex align-items-center">
                <a class="btn btn-primary btn-sm px-3" href="/create" role="button">Create Room</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="container py-lg-5">
            <div class="row align-items-center g-5">
                <div class="col-lg-7 text-center text-lg-start">
                    <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary px-3 py-2 mb-4 fw-bold">100%
                        Free & Open Source</span>
                    <h1 class="display-2 fw-bold mb-4 ls-tight">Play Your Hand. Win the Sprint.</h1>
                    <p class="lead text-muted mb-5 fs-4">Point your stories with a premium blackjack-dealer touch.
                        No registration, no ads, just fast voting for efficient sprint planning.</p>
                    <div class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-3">
                        <a href="/create" class="btn btn-primary btn-lg px-5 py-3 fw-bold">Create a Room</a>
                    </div>
                </div>
                <div class="col-lg-5 text-center">
                    <img src="/static/img/logo.webp" alt="Playscrum Logo" class="img-fluid">
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-5 border-top bg-body">
        <div class="container text-center">
            <p class="small text-muted mb-0">
                <a href="https://github.com/Cyclenerd/scrumpoker" class="text-decoration-none text-muted"
                    title="View code on GitHub">&lt;&gt; Code</a>
            </p>
        </div>
    </footer>
</body>

</html>
