<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Scrum Poker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icon/apple-touch.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon/192x192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #shaderCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
    <script>
        window.addEventListener('load', () => {
            initShader();
        });

        function initShader() {
            const canvas = document.getElementById('shaderCanvas');
            if (!canvas) return;
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;

            const vertexShaderSource = `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            // main_image_HD.glsl
            const fragmentShaderSource = `
                precision mediump float;
                uniform vec2 iResolution;
                uniform float iTime;

                #define SPIN_EASE 0.5
                #define colour_1 vec4(0.85,0.2,0.2,1.0)
                #define colour_2 vec4(0.0,157./255.,1.,1.0)
                #define colour_3 vec4(0.0,0.0,0.0,1.0)
                #define contrast 2.5
                #define spin_amount 0.4
                #define spin_time (iTime*spin_amount)

                void main() {
                    vec2 fragCoord = gl_FragCoord.xy;
                    float pixel_size = 1.0;
                    vec2 uv = (floor((fragCoord.xy)*(1./pixel_size))*pixel_size - 0.5*iResolution.xy)/length(iResolution.xy);
                    uv *= 1.3;
                    float uv_len = length(uv);

                    float speed = (spin_time*SPIN_EASE*0.2) + 302.2;
                    float new_pixel_angle = (atan(uv.y, uv.x)) + speed - SPIN_EASE*20.*(1.*spin_amount*uv_len + (1. - 1.*spin_amount));
                    uv = vec2(uv_len * cos(new_pixel_angle), uv_len * sin(new_pixel_angle));

                    uv *= 30.;
                    speed = iTime*(2.);
                    vec2 uv2 = vec2(uv.x+uv.y);

                    for(int i=0; i < 5; i++) {
                        uv2 += sin(max(uv.x, uv.y)) + uv;
                        uv  += 0.5*vec2(cos(5.1123314 + 0.353*uv2.y + speed*0.131121),sin(uv2.x - 0.113*speed));
                        uv  -= 1.0*cos(uv.x + uv.y) - 1.0*sin(uv.x*0.711 - uv.y);
                    }

                    float contrast_mod = (0.25*contrast + 0.5*spin_amount + 1.2);
                    float paint_res =min(2., max(0.,length(uv)*(0.035)*contrast_mod));
                    float c1p = max(0.,1. - contrast_mod*abs(1.-paint_res));
                    float c2p = max(0.,1. - contrast_mod*abs(paint_res));
                    float c3p = 1. - min(1., c1p + c2p);
                    
                    float shine = (0.3*max(c1p*5. - 4., 0.) + 0.4*max(c2p*5. - 4., 0.));

                    vec4 ret_col = (0.3/contrast)*colour_1 + (1. - 0.3/contrast)*(colour_1*c1p + colour_2*c2p + vec4(c3p*colour_3.rgb, c3p*colour_1.a)) + shine;

                    gl_FragColor = ret_col;
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error(gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                return;
            }

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                -1, -1,
                1, -1,
                -1, 1,
                1, 1
            ]), gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'position');
            const iResolutionLocation = gl.getUniformLocation(program, 'iResolution');
            const iTimeLocation = gl.getUniformLocation(program, 'iTime');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);

            const startTime = Date.now();

            function render() {
                const time = (Date.now() - startTime) / 1000;

                gl.clearColor(0, 0, 0, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.useProgram(program);

                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.enableVertexAttribArray(positionLocation);
                gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

                gl.uniform2f(iResolutionLocation, canvas.width, canvas.height);
                gl.uniform1f(iTimeLocation, time);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                requestAnimationFrame(render);
            }
            render();
        }
    </script>
</head>

<body class="bg-body">
    <canvas id="shaderCanvas"></canvas>
    <nav class="navbar bg-body-tertiary border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Scrum Poker
            </a>
            <div class="d-flex align-items-center">
                <a class="btn btn-primary btn-sm px-3" href="/create" role="button">Create Room</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="container py-lg-5">
            <div class="row align-items-center g-5">
                <div class="col-lg-7 text-center text-lg-start">
                    <span class="badge rounded-pill bg-secondary px-3 py-2 mb-4 fw-bold">100%
                        Free & Open Source</span>
                    <h1 class="display-2 fw-bold mb-4 ls-tight">Play Your Hand. Win the Sprint.</h1>
                    <p class="lead mb-5 fs-4">Point your stories with a premium blackjack-dealer touch.
                        No registration, no ads, just fast voting for efficient sprint planning.</p>
                    <div class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-3">
                        <a href="/create" class="btn btn-primary btn-lg px-5 py-3 fw-bold flex-fill">Create a Room</a>
                        <a href="https://github.com/Cyclenerd/scrumpoker"
                            class="btn btn-dark btn-lg px-5 py-3 fw-bold flex-fill">Source Code</a>
                    </div>
                </div>
                <div class="col-lg-5 text-center">
                    <img src="/static/img/logo.webp" alt="Playscrum Logo" class="img-fluid">
                </div>
            </div>
        </div>
    </main>
</body>

</html>
